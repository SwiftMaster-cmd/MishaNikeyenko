<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pod Checkpoint Dashboard</title>
<style>
  :root {
    --bg:#0b0b0b; --fg:#f2f2f2; --gold:#d9b25f; --muted:#888;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  html,body{
    height:100%; width:100%; margin:0; padding:0; background:var(--bg);
    color:var(--fg); font-family:var(--font); overflow:hidden;
  }
  .card{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:3vw; box-sizing:border-box;
  }
  .head{
    font-size:7vw; font-weight:800; text-transform:uppercase; margin:0;
  }
  .subhead{font-size:3vw; color:var(--muted); margin:0.5vw 0 1vw;}
  .rule{width:60%; height:0.4vw; background:var(--gold); margin:1vw 0 2vw;}
  .stats{font-size:3.5vw; line-height:1.5;}
  .gold{color:var(--gold);}
  .quote{font-size:2.8vw; font-style:italic; margin-top:2vw;}
  [contenteditable]{outline:none;border-bottom:0.3vw solid transparent;}
  [contenteditable]:focus{border-color:var(--gold);}
  /* Control buttons */
  .controls{
    position:fixed; top:1vw; left:1vw; display:flex; flex-wrap:wrap;
    gap:0.5vw; z-index:1000; background:rgba(0,0,0,0.6);
    padding:0.6vw 0.8vw; border-radius:0.8vw;
  }
  button{
    background:#1a1a1a; border:0.2vw solid #333; color:var(--fg);
    padding:0.5vw 1vw; border-radius:0.5vw; cursor:pointer;
    font-size:1.6vw;
  }
  button.active{border-color:var(--gold); color:var(--gold);}
  #toggleControls{
    position:fixed; bottom:1vw; right:1vw; background:var(--gold);
    color:#000; font-weight:700; border:none; border-radius:50%;
    width:4vw; height:4vw; font-size:2vw; cursor:pointer; z-index:1100;
  }
  .hide .controls{display:none;}
</style>
</head>
<body>
<div class="controls">
  <button id="btn10" class="active">10 AM OPEN</button>
  <button id="btn12">12 PM CHECKPOINT</button>
  <button id="btn2">2 PM PUSH</button>
  <button id="btn4">4 PM FINISH</button>
  <button id="btn6">6 PM POWER</button>
</div>
<button id="toggleControls">👁</button>

<div id="display" class="card">
  <h1 class="head" contenteditable="true">12 PM CHECKPOINT ⚡</h1>
  <div class="subhead" contenteditable="true">LIVE LOOK • WHERE WE STAND</div>
  <div class="rule"></div>
  <div class="stats">
    Current: <span contenteditable="true">4</span><br>
    Target: <span contenteditable="true">6</span><br>
    Pace: <span class="gold" contenteditable="true">67%</span><br>
    Goal: <span class="gold" contenteditable="true">9</span>
  </div>
  <div class="quote" contenteditable="true">Momentum wins. Two more and we reset the board.</div>
</div>

<script>
const data = {
  btn10:{head:"10 AM OPEN STRONG ⚡",sub:"ENERGY BUILDS FROM THE FIRST PITCH",
    current:0,target:2,pace:"--",goal:9,quote:"Start hot. Set the tone."},
  btn12:{head:"12 PM CHECKPOINT ⚡",sub:"LIVE LOOK • WHERE WE STAND",
    current:4,target:6,pace:"67%",goal:9,quote:"Momentum wins. Two more and we reset the board."},
  btn2:{head:"2 PM PUSH ⚡",sub:"RESET • HYDRATE • CLOSE 2 MORE",
    current:5,target:6,pace:"83%",goal:9,quote:"Energy wins afternoons."},
  btn4:{head:"4 PM FINISH STRONG ⚡",sub:"SIX WAS STANDARD -- FOUR MORE AND WE WIN THE DAY",
    current:6,target:8,pace:"100%",goal:9,quote:"Keep the floor hot. Finish the run."},
  btn6:{head:"6 PM POWER HOUR ⚡",sub:"ALL GAS • NO BRAKE • LAST PUSH OF THE DAY",
    current:7,target:9,pace:"110%",goal:9,quote:"End strong. No excuses."}
};
const buttons=document.querySelectorAll(".controls button");
const card=document.getElementById("display");
buttons.forEach(btn=>{
  btn.onclick=()=>{
    buttons.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    const d=data[btn.id];
    card.querySelector(".head").innerText=d.head;
    card.querySelector(".subhead").innerText=d.sub;
    const spans=card.querySelectorAll(".stats span");
    spans[0].innerText=d.current;
    spans[1].innerText=d.target;
    spans[2].innerText=d.pace;
    spans[3].innerText=d.goal;
    card.querySelector(".quote").innerText=d.quote;
  };
});
document.getElementById("toggleControls").onclick=()=>{
  document.body.classList.toggle("hide");
};
document.querySelectorAll('[contenteditable]').forEach(el=>{
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});
});
</script>
</body>
</html>
