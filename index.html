<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Pod Checkpoint Dashboard</title>
<style>
:root{
  --bg:#0b0b0b;--fg:#f2f2f2;--muted:#a9a9a9;--gold:#d9b25f;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html,body{margin:0;height:100%;width:100%;background:var(--bg);color:var(--fg);
  font-family:var(--font);overflow:hidden;}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%;gap:1.5vmin;padding:1.5vmin;box-sizing:border-box;}
.bar,.footer{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:1vmin;background:#000000c0;border:1px solid #222;border-radius:1.2vmin;
  padding:1vmin 1.5vmin;backdrop-filter:blur(8px);}
button{
  background:#121212;border:0.4vmin solid #2a2a2a;color:var(--fg);
  padding:1.2vmin 2.2vmin;border-radius:1vmin;cursor:pointer;
  font-size:2.2vmin;font-weight:700;min-width:10ch;touch-action:manipulation;
}
button.active{border-color:var(--gold);color:var(--gold);}
button.ghost{background:transparent;border-color:#333;color:#bbb}
.panel{display:flex;align-items:center;justify-content:center;border:1px solid #1a1a1a;
  border-radius:2vmin;background:linear-gradient(180deg,#000000e0,#000000f0);
  box-shadow:0 1vmin 6vmin rgba(0,0,0,.55);}
.card{text-align:center}
.head{font-size:8.5vmin;font-weight:850;text-transform:uppercase;margin:.2em 0 .1em}
.sub{font-size:3.6vmin;color:var(--muted);margin-bottom:1em}
.rule{width:70%;height:.6vmin;background:var(--gold);border-radius:.5vmin;margin:auto;margin-bottom:2vmin}
.stats{font-size:4.2vmin;line-height:1.5}
.gold{color:var(--gold)}
.quote{font-size:3.2vmin;font-style:italic;margin-top:2vmin}
[contenteditable]{outline:none;border-bottom:.4vmin solid transparent;transition:border-color .15s}
[contenteditable]:focus{border-color:var(--gold)}
.hiddenUI .bar,.hiddenUI .footer{display:none}
.hiddenUI .panel{box-shadow:none}
.slotBox{display:none;gap:0.8vmin;flex-wrap:wrap;justify-content:center;margin-top:0.5vmin}
.slotBox.visible{display:flex}
.slotBox button{font-size:1.8vmin;padding:0.8vmin 1.6vmin}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- header -->
  <div class="bar">
    <button class="tab active" data-key="t10">10 AM OPEN</button>
    <button class="tab" data-key="t12">12 PM CHECK</button>
    <button class="tab" data-key="t2">2 PM PUSH</button>
    <button class="tab" data-key="t4">4 PM FINISH</button>
    <button class="tab" data-key="t5">5 PM POWER</button>
    <button id="btnHide">👁 Screenshot</button>
  </div>

  <!-- center -->
  <div class="panel">
    <div class="card">
      <div id="head" class="head" contenteditable="true">12 PM CHECKPOINT ⚡</div>
      <div id="sub" class="sub" contenteditable="true">LIVE LOOK • WHERE WE STAND</div>
      <div class="rule"></div>
      <div class="stats">
        Current: <span id="curr" contenteditable="true">4</span><br>
        Target: <span id="targ" contenteditable="true">6</span><br>
        Pace: <span id="pace" class="gold">67%</span><br>
        Goal: <span id="goal" class="gold" contenteditable="true">9</span>
      </div>
      <div id="quote" class="quote" contenteditable="true">
        Momentum wins. Two more and we reset the board.
      </div>
    </div>
  </div>

  <!-- footer -->
  <div class="footer">
    <button id="btnSave" class="ghost">💾 Save</button>
    <button id="btnLoad" class="ghost">📂 Load</button>
    <button id="btnReset" class="ghost">♻️ Reset Day</button>
    <span style="color:#888;font-size:2vmin">Auto-saves as you type • Local only</span>
  </div>

  <div id="slotBox" class="slotBox">
    <button class="slot" data-slot="A">Save A</button>
    <button class="slotLoad" data-slot="A">Load A</button>
    <button class="slotClear" data-slot="A">Clear A</button>
    <button class="slot" data-slot="B">Save B</button>
    <button class="slotLoad" data-slot="B">Load B</button>
    <button class="slotClear" data-slot="B">Clear B</button>
    <button class="slot" data-slot="C">Save C</button>
    <button class="slotLoad" data-slot="C">Load C</button>
    <button class="slotClear" data-slot="C">Clear C</button>
  </div>

</div>

<script>
/* --- zoom prevention --- */
document.addEventListener('gesturestart', e=>e.preventDefault());
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{
  const now=Date.now();
  if(now-lastTouchEnd<=350)e.preventDefault();
  lastTouchEnd=now;
},{passive:false});

/* --- defaults --- */
const DEFAULTS={
 active:'t12',
 day:today(),
 tabs:{
  t10:{head:'10 AM OPEN STRONG ⚡',sub:'ENERGY BUILDS FROM THE FIRST PITCH',current:'0',target:'2',goal:'9',quote:'Start hot. Set the tone.'},
  t12:{head:'12 PM CHECKPOINT ⚡',sub:'LIVE LOOK • WHERE WE STAND',current:'4',target:'6',goal:'9',quote:'Momentum wins. Two more and we reset the board.'},
  t2:{head:'2 PM PUSH ⚡',sub:'RESET • HYDRATE • CLOSE 2 MORE',current:'5',target:'6',goal:'9',quote:'Energy wins afternoons.'},
  t4:{head:'4 PM FINISH STRONG ⚡',sub:'SIX WAS STANDARD -- FOUR MORE AND WE WIN THE DAY',current:'6',target:'8',goal:'9',quote:'Keep the floor hot. Finish the run.'},
  t5:{head:'5 PM POWER HOUR ⚡',sub:'ALL GAS • NO BRAKE • LAST PUSH OF THE DAY',current:'7',target:'9',goal:'9',quote:'End strong. No excuses.'}
 }
};
const LS_KEY='podDashV3';let state=load()||structuredClone(DEFAULTS);
if(state.day!==today()){Object.values(state.tabs).forEach(t=>t.current='0');state.day=today();save();}
const app=document.getElementById('app');
const tabs=[...document.querySelectorAll('.tab')];
const els={head,sub,curr,targ,goal,quote,pace:document.getElementById('pace')};
render();attach();

/* --- helpers --- */
function today(){const d=new Date();return d.toISOString().slice(0,10);}
function load(key=LS_KEY){try{return JSON.parse(localStorage.getItem(key))||null}catch{return null}}
function save(key=LS_KEY){localStorage.setItem(key,JSON.stringify(state));}
function render(){
 tabs.forEach(b=>b.classList.toggle('active',b.dataset.key===state.active));
 const t=state.tabs[state.active];
 els.head.textContent=t.head;els.sub.textContent=t.sub;
 els.curr.textContent=t.current;els.targ.textContent=t.target;
 els.goal.textContent=t.goal;els.quote.textContent=t.quote;
 updatePace();
}
function calcPace(c,t){c=parseFloat(c)||0;t=parseFloat(t)||0;return t?Math.round(c/t*100)+'%':'0%'}
function updatePace(){els.pace.textContent=calcPace(els.curr.textContent,els.targ.textContent);}
function snapshot(){
 const t=state.tabs[state.active];
 t.head=els.head.textContent.trim();
 t.sub=els.sub.textContent.trim();
 t.current=els.curr.textContent.trim();
 t.target=els.targ.textContent.trim();
 t.goal=els.goal.textContent.trim();
 t.quote=els.quote.textContent.trim();
}
function attach(){
 tabs.forEach(b=>b.onclick=()=>{snapshot();state.active=b.dataset.key;save();render();});
 [els.head,els.sub,els.curr,els.targ,els.goal,els.quote].forEach(el=>{
  el.addEventListener('input',()=>{if(el===els.curr||el===els.targ)updatePace();snapshot();save();});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur();}});
 });
 document.getElementById('btnHide').onclick=()=>{
  app.classList.toggle('hiddenUI');
 };
 document.body.onclick=e=>{
  if(app.classList.contains('hiddenUI')){app.classList.remove('hiddenUI');}
 };
 document.getElementById('btnSave').onclick=()=>{snapshot();save();flash('Saved Auto');};
 document.getElementById('btnReset').onclick=()=>{
  if(confirm('Reset current numbers for today?')){
   Object.values(state.tabs).forEach(t=>t.current='0');
   snapshot();save();render();flash('Reset');
  }
 };
 const slotBox=document.getElementById('slotBox');
 document.getElementById('btnLoad').onclick=()=>{
   slotBox.classList.toggle('visible');
 };
 slotBox.querySelectorAll('.slot').forEach(b=>{
   b.onclick=()=>{snapshot();localStorage.setItem(LS_KEY+'_'+b.dataset.slot,JSON.stringify(state));flash('Saved '+b.dataset.slot);}
 });
 slotBox.querySelectorAll('.slotLoad').forEach(b=>{
   b.onclick=()=>{const d=load(LS_KEY+'_'+b.dataset.slot);if(d){state=d;render();flash('Loaded '+b.dataset.slot);}else flash('Empty');}
 });
 slotBox.querySelectorAll('.slotClear').forEach(b=>{
   b.onclick=()=>{localStorage.removeItem(LS_KEY+'_'+b.dataset.slot);flash('Cleared '+b.dataset.slot);}
 });
}
function flash(msg){
 const f=document.createElement('div');
 Object.assign(f.style,{position:'fixed',bottom:'2vmin',left:'50%',transform:'translateX(-50%)',
   background:'#111',color:'#ddd',border:'1px solid #333',padding:'1vmin 1.6vmin',borderRadius:'1vmin',
   zIndex:2000,boxShadow:'0 .8vmin 2vmin rgba(0,0,0,.45)',fontSize:'2vmin'});
 f.textContent=msg;document.body.appendChild(f);setTimeout(()=>f.remove(),1200);
}
</script>
</body>
</html>
