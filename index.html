<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pod Checkpoint Dashboard</title>
<style>
  :root{
    --bg:#0b0b0b; --panel:#000000cc; --fg:#f2f2f2; --muted:#a9a9a9; --gold:#d9b25f;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  html,body{height:100%;width:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;}
  .app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:1.2vmin;padding:1.8vmin;box-sizing:border-box;}
  /* Controls */
  .bar{display:flex;gap:1vmin;align-items:center;justify-content:center;background:var(--panel);
       border:1px solid #222;border-radius:1.2vmin;padding:1vmin 1.2vmin;backdrop-filter:blur(8px);}
  .bar .left,.bar .right{display:flex;gap:1vmin;align-items:center}
  .bar .left{flex-wrap:wrap;justify-content:center}
  button{
    background:#121212;border:0.5vmin solid #2a2a2a;color:var(--fg);
    padding:1.2vmin 2.4vmin;border-radius:1.2vmin;font-size:2.2vmin;font-weight:700;
    cursor:pointer;touch-action:manipulation;min-width:10ch;
  }
  button:active{transform:translateY(0.2vmin)}
  .tab.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0.8vmin #000,0 0 1.2vmin #000,0 0 1.2vmin inset #000;}
  .ghost{background:transparent;border-color:#333;color:#ccc}
  /* Panel */
  .panel{
    position:relative;align-self:stretch;justify-self:stretch;
    display:flex;align-items:center;justify-content:center;
    padding:3vmin;background:linear-gradient(180deg,#000000e6,#000000f0);
    border-radius:2vmin;border:1px solid #1a1a1a;box-shadow:0 1.4vmin 6vmin rgba(0,0,0,.55);
  }
  .card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .head{font-size:8.4vmin;font-weight:850;text-transform:uppercase;margin:.2em 0 .15em}
  .sub{font-size:3.6vmin;color:var(--muted);margin:0 0 .7em}
  .rule{width:min(70vmin,70%);height:.8vmin;background:var(--gold);border-radius:.6vmin;margin:0 0 2.2vmin}
  .stats{font-size:4.2vmin;line-height:1.5}
  .gold{color:var(--gold)}
  .quote{font-size:3.2vmin;font-style:italic;margin-top:2.2vmin}
  [contenteditable]{outline:none;border-bottom:.6vmin solid transparent;transition:border-color .15s}
  [contenteditable]:focus{border-color:var(--gold)}
  /* Footer */
  .footer{display:flex;gap:1vmin;align-items:center;justify-content:center;background:var(--panel);
          border:1px solid #222;border-radius:1.2vmin;padding:1vmin 1.2vmin}
  /* Hide modes */
  .hiddenUI .bar,.hiddenUI .footer{display:none}
  .hiddenUI [contenteditable]{caret-color:transparent}
  .hiddenUI .panel{box-shadow:none;border-color:#000}
  /* Small devices text balance */
  @media (max-aspect-ratio: 4/5){
    .head{font-size:9vmin}
    .stats{font-size:4.8vmin}
    .quote{font-size:3.8vmin}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Top controls -->
  <div class="bar">
    <div class="left">
      <button class="tab active" data-key="t10">10 AM OPEN</button>
      <button class="tab" data-key="t12">12 PM CHECK</button>
      <button class="tab" data-key="t2">2 PM PUSH</button>
      <button class="tab" data-key="t4">4 PM FINISH</button>
      <button class="tab" data-key="t6">6 PM POWER</button>
    </div>
    <div class="right">
      <button id="btnHide" title="Toggle Screenshot Mode (hide UI)">👁 Screenshot</button>
    </div>
  </div>

  <!-- Center panel -->
  <div class="panel">
    <div class="card" aria-live="polite">
      <div class="head" id="head" contenteditable="true">12 PM CHECKPOINT ⚡</div>
      <div class="sub" id="sub" contenteditable="true">LIVE LOOK • WHERE WE STAND</div>
      <div class="rule"></div>
      <div class="stats">
        Current: <span id="curr" contenteditable="true">4</span><br>
        Target: <span id="targ" contenteditable="true">6</span><br>
        Pace: <span id="pace" class="gold">67%</span><br>
        Goal: <span id="goal" class="gold" contenteditable="true">9</span>
      </div>
      <div class="quote" id="quote" contenteditable="true">Momentum wins. Two more and we reset the board.</div>
    </div>
  </div>

  <!-- Footer controls -->
  <div class="footer">
    <button class="ghost" id="btnSave">💾 Save Now</button>
    <button class="ghost" id="btnLoad">🔄 Load Saved</button>
    <button class="ghost" id="btnReset">♻️ Reset Day</button>
    <span style="color:#888;font-size:2vmin;">Autosaves as you type • Local only</span>
  </div>
</div>

<script>
/* ---------- Prevent pinch/double-tap zoom for iOS ---------- */
document.addEventListener('gesturestart', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', function (e) {
  const now = Date.now();
  if (now - lastTouchEnd <= 350) e.preventDefault();
  lastTouchEnd = now;
}, {passive:false});

/* ---------- Data model & defaults ---------- */
const DEFAULTS = {
  active: 't12',
  dayKey: dayStamp(),
  tabs: {
    t10: {head:'10 AM OPEN STRONG ⚡', sub:'ENERGY BUILDS FROM THE FIRST PITCH', current:'0', target:'2', goal:'9', quote:'Start hot. Set the tone.'},
    t12: {head:'12 PM CHECKPOINT ⚡',   sub:'LIVE LOOK • WHERE WE STAND',       current:'4', target:'6', goal:'9', quote:'Momentum wins. Two more and we reset the board.'},
    t2:  {head:'2 PM PUSH ⚡',          sub:'RESET • HYDRATE • CLOSE 2 MORE',   current:'5', target:'6', goal:'9', quote:'Energy wins afternoons.'},
    t4:  {head:'4 PM FINISH STRONG ⚡', sub:'SIX WAS STANDARD -- FOUR MORE AND WE WIN THE DAY', current:'6', target:'8', goal:'9', quote:'Keep the floor hot. Finish the run.'},
    t6:  {head:'6 PM POWER HOUR ⚡',    sub:'ALL GAS • NO BRAKE • LAST PUSH OF THE DAY', current:'7', target:'9', goal:'9', quote:'End strong. No excuses.'}
  }
};

const LS_KEY = 'podCheckpointV2';
let state = loadState() || structuredClone(DEFAULTS);

/* ---------- Elements ---------- */
const app = document.getElementById('app');
const tabs = Array.from(document.querySelectorAll('.tab'));
const head = document.getElementById('head');
const sub = document.getElementById('sub');
const curr = document.getElementById('curr');
const targ = document.getElementById('targ');
const pace = document.getElementById('pace');
const goal = document.getElementById('goal');
const quote = document.getElementById('quote');

/* ---------- Init ---------- */
autoDayReset();
renderActive();
attachHandlers();
updatePace();
autosave();

/* ---------- Functions ---------- */
function dayStamp(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}
function autoDayReset(){
  if (state.dayKey !== dayStamp()){
    // new day: keep heads/subs/goals/targets; reset current + quotes minimal
    Object.keys(state.tabs).forEach(k=>{
      state.tabs[k].current = '0';
      // keep quote as-is; adjust if you prefer a daily default
    });
    state.dayKey = dayStamp();
    saveState();
  }
}
function setActive(k){
  state.active = k;
  saveState();
  renderActive();
}
function renderActive(){
  tabs.forEach(b=>b.classList.toggle('active', b.dataset.key===state.active));
  const t = state.tabs[state.active];
  head.textContent  = t.head;
  sub.textContent   = t.sub;
  curr.textContent  = t.current;
  targ.textContent  = t.target;
  goal.textContent  = t.goal;
  quote.textContent = t.quote;
  updatePace();
}
function calcPace(c,t){
  const cc = parseFloat(String(c).replace(/[^0-9.\-]/g,'')) || 0;
  const tt = parseFloat(String(t).replace(/[^0-9.\-]/g,'')) || 0;
  if(!tt) return '0%';
  return Math.round((cc/tt)*100) + '%';
}
function updatePace(){
  pace.textContent = calcPace(curr.textContent, targ.textContent);
}
function snapshotFromDOM(){
  const t = state.tabs[state.active];
  t.head   = head.textContent.trim();
  t.sub    = sub.textContent.trim();
  t.current= curr.textContent.trim();
  t.target = targ.textContent.trim();
  t.goal   = goal.textContent.trim();
  t.quote  = quote.textContent.trim();
}
function attachHandlers(){
  tabs.forEach(btn=>{
    btn.addEventListener('click', ()=> setActive(btn.dataset.key));
  });
  [head,sub,curr,targ,goal,quote].forEach(el=>{
    el.addEventListener('input', ()=>{
      if (el===curr || el===targ) updatePace();
      snapshotFromDOM(); saveState();
    });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); el.blur(); }});
  });
  document.getElementById('btnHide').addEventListener('click', ()=>{
    app.classList.toggle('hiddenUI');
    // blur any active editable to avoid cursor in screenshots
    document.activeElement && document.activeElement.blur && document.activeElement.blur();
  });
  document.getElementById('btnSave').addEventListener('click', ()=>{ snapshotFromDOM(); saveState(); flash('Saved'); });
  document.getElementById('btnLoad').addEventListener('click', ()=>{
    const s = loadState(); if(!s) return;
    state = s; renderActive(); flash('Loaded');
  });
  document.getElementById('btnReset').addEventListener('click', ()=>{
    if(confirm('Reset currents to 0 for today?')){
      Object.keys(state.tabs).forEach(k=> state.tabs[k].current='0');
      snapshotFromDOM(); saveState(); renderActive(); flash('Reset');
    }
  });
}
function autosave(){
  // redundant periodic save as safety
  setInterval(()=>{ snapshotFromDOM(); saveState(); }, 5000);
}
function flash(msg){
  const f = document.createElement('div');
  f.textContent = msg;
  Object.assign(f.style,{
    position:'fixed',bottom:'2vmin',left:'50%',transform:'translateX(-50%)',
    background:'#111',color: '#ddd',border:'1px solid #333',padding:'1vmin 1.6vmin',
    borderRadius:'1vmin',zIndex:2000,boxShadow:'0 .8vmin 2vmin rgba(0,0,0,.45)',
    fontSize:'2vmin'
  });
  document.body.appendChild(f);
  setTimeout(()=>{ f.remove(); }, 1200);
}
</script>
</body>
</html>
